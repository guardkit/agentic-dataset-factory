# PO Phase 1 — generative (no-book) BULK generation.
# grounded: false => no ChromaDB, no rag tool, no Curriculum Context; the Player
# generates PO ProductRoadmap examples from the GOAL taxonomy.
#
# Player gpt-oss-120b + Coach gemma4-coach co-reside via the EXISTING
# `autobuild_go` llama-swap set ("go & gc") — no llama-swap config edit.
# Requesting gpt-oss-120b EVICTS the always-on fleet, so pause the keepalive
# timer FIRST (else it revives the fleet on top of gpt-oss -> OOM):
#   sudo systemctl stop llama-swap-keepalive.timer    # before the run
#   sudo systemctl start llama-swap-keepalive.timer   # after the run
#
# CURRENT = bounded PILOT: limit 60, category-interleaved, 5 no-corpus modes
# round-robined (~4-5h). Validates balanced quality/mode-coverage at scale.
#
# FULL RUN (after the pilot): remove `limit` (=> all 1,100 targets, ~82h) and
# run with `python agent.py`; resume after any interruption with
# `python agent.py --resume` (checkpoint/resume is per expanded-target index).
domain: product-owner

player:
  provider: local
  model: gpt-oss-120b
  endpoint: http://localhost:9000/v1
  temperature: 0.5

coach:
  provider: local
  model: gemma4-coach
  endpoint: http://localhost:9000/v1
  temperature: 0.2
  max_tokens: 8192                 # headroom so verbose fallback verdicts don't truncate

generation:
  grounded: false                  # PO Phase 1: no-book generative mode
  require_fenced_json: true        # gate: assistant ```json ProductRoadmap must strictly parse
  limit: 12                        # SMALL re-verify of the fixes (was 60 pilot; remove for full run)
  modes:                           # round-robined per target (no-corpus modes)
    - idea
    - greenfield
    - evolve
    - impact
    - scope
  max_turns: 3
  llm_retry_attempts: 3
  llm_retry_backoff: 2.0
  llm_timeout: 300
  target_timeout: 900

chunking:
  chunk_size: 512
  overlap: 64

logging:
  level: INFO
  format: json
