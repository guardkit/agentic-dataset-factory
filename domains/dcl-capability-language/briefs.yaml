# DCL feature-brief seed bank — 200 one-paragraph briefs across diverse business
# domains for the dcl-capability-language domain (AUTHOR mode inputs + dcl_repair
# source renders). Each brief names the actor kind, the typed intent shape, the
# outcomes, the emitted event, one policy family+concern, and a lifecycle. NONE
# describes the frozen hold-out endpoints (stats/version/uptime/GetStats).
# brief-001..brief-050: generated + compiler-verified 2026-07-17 (pin 4f9fbe56).
# brief-051..brief-200: appended 2026-07-18 — 30 additional business domains, all 4
#   actor kinds, all 4 effect kinds, all 9 policy families (incl. confidence), intent
#   shapes of 0–5 fields (mixed types incl. List<T>/Money/Email/Date/DateTime/Boolean),
#   event payloads of 2–5 fields, lifecycles of 2–4 states (active/decision/waiting step
#   kinds), and ~30 multi-outcome capabilities. Every render compiles clean, denylist-clean.
# ids are deterministic brief-001..brief-200.
briefs:
- id: brief-001
  domain: orders
  title: PlaceOrder (orders)
  paragraph: 'A a person (actor kind human) initiates a orders capability, PlaceOrder. The intent shape
    OrderRequest carries id (Uuid) required, amount (Money) required, note (Text). The capability validates
    the request (ValidOrder: amount above 0) and reports outcome OrderConfirmed on success, or OrderRejected
    otherwise. It emits a OrderRecorded event carrying id (Uuid) required, recordedAt (DateTime) required,
    persists through a persistence effect (PersistOrder), and is governed by a reliability policy enforcing
    idempotency required; timeout 5 seconds. Its lifecycle moves from Started to Completed once OrderConfirmed
    is reached.'
  actor_name: Customer
  actor_kind: human
  shape_name: OrderRequest
  fields:
  - name: id
    type: Uuid
    required: true
  - name: amount
    type: Money
    required: true
  - name: note
    type: Text
    required: false
  event_name: OrderRecorded
  event_fields:
  - name: id
    type: Uuid
    required: true
  - name: recordedAt
    type: DateTime
    required: true
  effect_name: PersistOrder
  effect_kind: persistence
  policy_name: OrderPolicy
  policy_family: reliability
  concerns: &id001
  - idempotency required
  - timeout 5 seconds
  capability_name: PlaceOrder
  success_outcome: OrderConfirmed
  failure_outcome: OrderRejected
  rule_name: ValidOrder
  rule_expr: amount above 0
