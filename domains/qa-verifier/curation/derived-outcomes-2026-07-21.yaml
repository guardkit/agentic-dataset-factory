# QAV DERIVED OUTCOMES — evidence-derived curator labels, ADVERSARIALLY VERIFIED
# ================================================================================
# THE LAW (ratified Option B, Rich 2026-07-21): a label rests ONLY on committed
#   records (fix commits, retros, receipts, gate histories, merge summaries). The
#   bundle's own contents NEVER label it. A hint without a committed record = the
#   bundle stays excluded. New derivation RULES are allowed but stated PER LABEL;
#   Rich ratifies rules+labels together in one batch. Gold-source tasks
#   (SPEC-qav-gold-negatives.md) are never re-labeled. A2 (manual-fix approve)
#   stays excluded.
#
# disposition: pending-rich  — NOTHING here is consumable until Rich taps
#   "approve the batch" against curation/batch-review-card-2026-07-21.md.
#   Banking != training: DF-008-private DATA; no tune trains in this lane.
#
# Schema mirrors outcomes/harvest-outcomes-2026-07-21.yaml (the `outcomes` input to
#   src/qav/harvest.py::harvest(), keyed by (repo, task)). Every row adds:
#     provenance.rule  — the NEW per-label derivation rule (below), stated once each.
#     provenance.record_path — the committed record OTHER than the bundle the label
#                              is READ FROM.
#     bundle_path      — the discovered final-turn coach_evidence the label attaches to.
#
# NEW DERIVATION RULES (each stated per label; Rich ratifies with the labels):
#   A1-LIVE                 approve iff committed independent behavioural re-verification
#                           on the merged/deployed tree (not merely merge-clean).
#   independent-guard-held  approve iff a committed record OTHER than the bundle re-exercises
#                           the task's exact contract surface post-authoring and holds.
#   A1'-review-summary-approve  approve iff committed review-summary.md Decision==approved AND
#                           events.jsonl verification_status==approve at the merge onto main,
#                           merge is ancestor of main, no later fix touches the defect surface.
#   MP-A                    approve iff the committed adversarial post-merge review (proven to
#                           catch sibling escapes) affirmatively recorded THIS task PASS and no
#                           defect-fix touched its core surface (positive adversarial confirmation).
#   A1-J                    approve iff the committed feature-tracker YAML records
#                           result.final_decision==approved (jarvis has no merge_summary.json),
#                           merge clean + ancestor of main + independent post-merge live-gate
#                           exercised the runtime surface + no post-approval fix names the task.
#   MP-R                    reject (escape) iff the committed adversarial post-merge review
#                           recorded a MEDIUM+ CONFIRMED defect in the coach-approved task's OWN
#                           module and a later commit substantively rewrote it to close it.
#
# REFUTED (excluded, kept for the honest footer): TASK-STAT-001 (live-gate binds to the
#   later FIX tree a58bf31, not the approved merge 42ba0dd where /stats 404s — fails A1-LIVE
#   clause b); TASK-HARV-004 (cited final-turn bundle is decision=feedback, all 9 criteria
#   REJECTED, honesty.verified=false — the opposite of clean-green).

