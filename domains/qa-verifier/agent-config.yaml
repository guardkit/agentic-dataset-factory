# qa-verifier seeded-defect generation config (finalized from agent-config.draft.yaml).
# RUNNABLE via domains/qa-verifier/run_qav_generation.py once (a) the served fleet is up on
# :9000, (b) guardkit is importable against each corpus repo's pytest substrate (see
# `interpreters:` below — the SIBTESTENV01 per-repo lesson, config not hardcode), and (c) the
# GB10 program-plan calendar has cleared the box (teacher rationale is the only GPU stage;
# bundle regeneration is CPU/pytest-substrate-dominant).
#
# The draft (agent-config.draft.yaml) is the byte-untouched spec-half sketch; this is its
# finalized, runnable sibling. Deltas: mode is now runnable, scratch_dir + interpreters +
# dataset_id added, output.manifest kept.

domain: qa-verifier

# Teacher authors <think> rationales AGAINST labels fixed by the injector — it never decides
# verdicts. Different family from the judged Player (D9 rule; WS4's serving call).
player:                      # seat reused as the rationale TEACHER in seeded_defect mode
  provider: local
  model: gpt-oss-120b
  endpoint: http://localhost:9000/v1
  temperature: 0.4
  max_tokens: 4096

coach:                       # row-quality gate: schema + label-consistency + cue-audit
  provider: local
  model: qav-coach           # SAME coach-ft-v3 GGUF via the qav-set unique alias (2026-07-21):
                             # requesting qav-coach forces the co-resident `qav` llama-swap set
                             # (go stays loaded), curing the per-leg eviction thrash the
                             # 2026-07-21 harvest run walled on. coach-ft-v3 remains the alias
                             # for all-family lanes; endpoint :9000 (not :8080).
  endpoint: http://localhost:9000/v1
  temperature: 0.2
  max_tokens: 8192

generation:
  grounded: false
  mode: seeded_defect        # seeded_defect | harvest | both
  require_fenced_json: true  # assistant must emit the OUTPUT-CONTRACT §3 verdict object
  seeded_bundle_cap: 0.25    # max share of seeded rows via bundle mutation (PLAN §2)
  holdout_fraction: 0.15     # eval_qav slice, frozen by the recorded seed (PLAN §6)
  seed: qav-phase1           # split RNG seed (recorded so the split is reproducible)
  scratch_dir: output/qa-verifier/_scratch   # per-recipe worktrees; cleaned up per row
  dataset_id: qav-phase1-train-v1
  # Ratified harvest labels (census §2, Rich 2026-07-21). Consumed only in mode: harvest|both.
  # Labels come ONLY from committed records; queued/flagged entries are skipped + counted, never
  # guessed. Unset => the harvest path is inert-clean (no harvested rows).
  harvest_outcomes: domains/qa-verifier/harvest-outcomes.yaml
  # limit: 4                 # PILOT CAP — uncomment for a spike; remove for the full run
  recipes:                   # PLAN §3 table; weights = GOAL.md reject shares
    R-DC03-callsite: 0.10
    R-DC03-producer: 0.10
    R-DC03-kwargs: 0.10
    R-DC03-mockseam: 0.10
    R-DC05-sysmod: 0.075
    R-DC05-skipguard: 0.075
    R-DC08-undefstep: 0.075
    R-DC08-pendmask: 0.075
    R-DC12-planvisible: 0.05
    R-DC14-narrative: 0.10
    R-ABSENT-junit: 0.10
    # remaining 0.05: seeded-control no-op greens ride a separate approve-side counter

corpus:                      # read-only source repos (venue rule) — scratch worktrees only
  guardkit: /home/richardwoollcott/Projects/appmilla_github/guardkit
  study_tutor: /home/richardwoollcott/Projects/appmilla_github/study-tutor
  forge: /home/richardwoollcott/Projects/appmilla_github/forge
  # Roots for the 2026-07-21 ratified batch labels (repo keys = THE spelling outcome entries
  # must use; consistent underscore keys). None of these carries a .guardkit/archive
  # merge_summary.json, so they add HARVEST bundle discovery only — zero new seeded source tasks.
  # G1 (2026-07-21) added the FEATURE-TRACKER reader (qav.discover): these repos' completed
  # .guardkit/features/*.yaml + archive/*/feature_state.yaml are now WALKED, so every approved
  # tracker task is turned away by a PRECISE recorded exclusion instead of being silently
  # invisible. Seeded INCLUSION stays merge_summary-gated by the honesty law (a tracker approve is
  # not an autobuild coach-approve; forge FEAT-FMDR proved a tracker 'approved'+merged-sha can be a
  # documented false-green) — so these still contribute ZERO new seeded source tasks, now audibly.
  api_test: /home/richardwoollcott/Projects/appmilla_github/api_test
  nats_core: /home/richardwoollcott/Projects/appmilla_github/nats-core
  jarvis: /home/richardwoollcott/Projects/appmilla_github/jarvis
  # The remaining two repos of the harvest union census's 8 (fleet-memory + specialist-agent).
  # Same story: feature-tracker records only (no merge_summary), so tracker-walked + excluded, not
  # included. specialist-agent FEAT-32E7/8060 DO record a resolvable "merged to main <sha>" in
  # completed_evidence, but their per-task decisions are stale 'pending' (no per-task approval) —
  # named in the exclusion, never inferred into an approve.
  fleet_memory: /home/richardwoollcott/Projects/appmilla_github/fleet-memory
  specialist_agent: /home/richardwoollcott/Projects/appmilla_github/specialist-agent
  bundle_schema_sha: "41a0ebe457"
  # Factory-side record store(s) — recovered authentic run records for the 10 discovered tasks
  # whose task_work_results.json was not reachable at their corpus HEAD by the .guardkit globs
  # (S-B, 2026-07-21). Laid out as <root>/<repo>/<task>/; searched AFTER the corpus globs, never
  # a corpus write. See domains/qa-verifier/record-store/index.json for per-file sha256 provenance.
  record_store_roots:
    - domains/qa-verifier/record-store

# Per-repo interpreter/venv resolution for the regenerator's pytest substrate (SIBTESTENV01:
# config, not hardcode). Threaded at worktree/regeneration setup time in the attended run.
interpreters:
  guardkit: /home/richardwoollcott/Projects/appmilla_github/guardkit/.venv/bin/python
  study_tutor: /home/richardwoollcott/Projects/appmilla_github/study-tutor/.venv/bin/python
  forge: /home/richardwoollcott/Projects/appmilla_github/forge/.venv/bin/python
  # Insurance for the new corpus roots (harvest reads bundles in place and never regenerates,
  # but a root without an interpreter would crash the regenerator loudly if a seeded task ever
  # appears there). All three venvs verified present on disk.
  api_test: /home/richardwoollcott/Projects/appmilla_github/api_test/.venv/bin/python
  nats_core: /home/richardwoollcott/Projects/appmilla_github/nats-core/.venv/bin/python
  jarvis: /home/richardwoollcott/Projects/appmilla_github/jarvis/.venv/bin/python
  fleet_memory: /home/richardwoollcott/Projects/appmilla_github/fleet-memory/.venv/bin/python
  specialist_agent: /home/richardwoollcott/Projects/appmilla_github/specialist-agent/.venv/bin/python

# DEEP-REGENERATION bridge config (render-collapse layers 1+2+4, 2026-07-21). Threaded to the
# qav_regenerate_bridge so guardkit gather_evidence REACHES + RUNS the mutated worktree's tests
# (the render-collapse root cause was that it never did — a spurious arch gate aborted it, and the
# oracle then misdetected the stack as node). See receipts/render-collapse-rootcause §"SPIKE".
regeneration:
  # LAYER 1 — profile-gate. ``integration``'s quality-gate profile REQUIRES tests + plan_audit but
  # NOT arch_review/coverage — exactly the gates the materialized task_work_results record carries
  # (the approved-green tasks record tests_passing + a skipped plan_audit and NO arch result — arch
  # runs in a separate guardkit phase). With ``feature`` (the default) the missing arch gate makes
  # all_gates_passed=false → gather_evidence aborts at partial_gate_abort and NEVER runs the
  # worktree tests (the source-blind replay). ``integration`` lets it proceed to the independent
  # test run. This is the SANCTIONED profile-selection path, NOT skip_arch_review (render-collapse
  # proved skip_arch_review alone net-harmful: it defeats dedup by timing noise). No guardkit code
  # change — the task_type is threaded into the task dict guardkit already resolves the profile from.
  task_type: integration
  test_timeout: 1800
  # LAYER 2 — per-repo stack pin (the interpreters-map pattern). An explicit pytest command pins the
  # worktree test substrate so the oracle never MISDETECTS node/npm on a Python repo (the
  # returncode-127 wall). The command MUST start with ``pytest`` so guardkit runs it under the repo's
  # pinned venv interpreter. LAYER 4 — the scope MUST (a) include the active recipes' mutated-file
  # tests so a planted DC-03/DC-05 defect surfaces as a real failing test, and (b) stay GREEN on the
  # no-op control (so the control's approve label is honest). The guardkit scope below is the one the
  # 2026-07-21 SPIKE validated: control clean-green, R-DC03-mockseam surfaced 4 real FAILED tests,
  # run-twice deterministic. The study_tutor scope is the 2026-07-22 SPIKE-validated service-free
  # unit surface: R-DC03-callsite (study_tutor variant — retiring CorpusChunk.chunk_index) surfaces
  # as real ValidationError failing tests, the no-op control stays clean-green, run-twice
  # deterministic. BROADEN either (staying control-green) before enabling recipes whose targets live
  # outside the pinned file. study_tutor now anchors R-DC03-callsite; its other 10 recipes remain
  # honest expected-misses (guardkit-shaped or out-of-scope) — see receipts/study-tutor-reject-anchors.
  test_commands:
    guardkit: "pytest tests/orchestrator/test_wiring_seam_real_factory.py -q -p no:cacheprovider"
    # jarvis (B1, 2026-07-22 SPIKE-validated — receipts/per-repo-test-command-pins). The ONLY
    # target-repo pin of the forge/jarvis/nats_core sweep: forge (5 tasks) + nats_core (1 task)
    # anchor ZERO reject recipes → honest expected-miss, NO pin (all 11 recipes ANCHOR_SKIP:
    # guardkit-shaped or non-unique on their trees). jarvis's R-DC08-{undefstep,pendmask} both
    # anchor on the ONE BDD glue file below, mutating the shared background step
    # ``@given("Jarvis is starting up with a configured NATS endpoint")``. That file is 43-failed
    # /2-passed at the approved sha (feat-004's other scenarios are honestly ``scenarios_pending``
    # → StepDefinitionNotFoundError, the FEAT-BDDM convention), so the WHOLE-file scope is NOT
    # control-green. ``-k publishes`` selects EXACTLY the two TASK-J004-007 scenarios carrying the
    # mutated background step (control: 2 passed / 43 deselected — GREEN + service-free, uses
    # nats_core.InMemoryManifestRegistry, no broker). LAYER-2 tokenisation law: guardkit runs the
    # command via ``test_cmd.split()`` (coach_validator ~L5422, shell=False), so every arg MUST be
    # whitespace-free — ``-k publishes`` (a SINGLE token uniquely matching publishes/republishes
    # across all 45 names) replaces a quoted ``-k "a or b"`` (which would tokenise into broken
    # args). ``-p no:warnings`` suppresses the pytest UNKNOWN-MARK warnings summary, whose line
    # ORDER is non-deterministic across runs (conftest.py:59 iterating tags set-wise) and lands in
    # ``independent_tests.raw_output`` — a scrub-untouched field; suppressing it AT SOURCE makes the
    # pendmask (skip-evidence) leg byte-deterministic. SPIKE (real bridge, integration profile,
    # TASK-JNB-001, run twice): CONTROL green; R-DC08-undefstep DIVERGED + real failing-test
    # evidence (failure_class=collection_error — the deleted step-def breaks collection) +
    # DETERMINISTIC; R-DC08-pendmask DIVERGED (2-skipped vs 2-passed = the honest masking signature)
    # + DETERMINISTIC.
    jarvis: "pytest features/feat-jarvis-004-fleet-registration-and-specialist-dispatch/test_feat_jarvis_004_fleet_registration_and_specialist_dispatch.py -k publishes -p no:cacheprovider -p no:warnings"
    study_tutor: "pytest tests/unit/knowledge/test_corpus_models.py -q -p no:cacheprovider"

output:
  dir: output/qa-verifier
  manifest: domains/qa-verifier/manifests/qav-phase1-train.manifest.json
  visibility: private        # DF-008

logging:
  level: INFO
  format: json
