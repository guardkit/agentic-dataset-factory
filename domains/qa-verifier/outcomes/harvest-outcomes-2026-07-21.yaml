    task: TASK-SMP2-07
    verdict: reject
    ground_truth_source: operator_caught
    feature: FEAT-SMP-002
    run: reconstructed
    sha: "54ab79fd"            # retro commit
    dc_class: DC-08
    finding:
      class: DC-08
      locus: "bdd=null on the step-def authoring task itself (no TASK-SMP2-07_junit.xml); approval leaned on Player-self-reported scenario counts — absent signal != pass"
    reconstruction_fidelity: reconstructed
    bundle_path: null
    provenance:
      record_path: guardkit/docs/retros/2026-07-04-autobuild-coach-missed-undefined-bdd-step.md
      sha: "54ab79fd"
      rule: R1

  - repo: study-tutor          # GN-2
    task: TASK-SMP3-06
    verdict: reject
    ground_truth_source: operator_caught
    feature: FEAT-SMP-003
    run: reconstructed
    sha: "99bf79d5"            # retro commit
    dc_class: DC-03
    finding:
      class: DC-03
      locus: "cli/main.py:serve + _build_nats_runtime — MCPAdapter(...) call sites pass retired kwargs; only injected-dependency unit test updated (validates class contract, never call sites); runtime_parity absent"
    reconstruction_fidelity: reconstructed
    bundle_path: null
    provenance:
      record_path: guardkit/docs/retros/2026-07-04-autobuild-signature-change-missed-production-callsites.md
      sha: "99bf79d5"
      rule: R1

  - repo: guardkit             # GN-3 — verbatim bundle survives on disk
    task: TASK-QAV-005
    verdict: reject
    ground_truth_source: merge_review_caught
    feature: FEAT-10AC
    run: "run-3"
    sha: "888906f2"            # merge sha
    dc_class: DC-03
    finding:
      class: DC-03
      locus: "gather_evidence hardcodes behavioural_oracle=None while _apply_behavioural_oracle_guard ships — runner-without-producer; fs-01 AC soft-pedaled to match"
    reconstruction_fidelity: verbatim
    bundle_path: guardkit/.guardkit/worktrees/FEAT-10AC/.guardkit/autobuild/TASK-QAV-005/coach_evidence_turn_2.json
    provenance:
      record_path: guardkit/docs/retro/qa-verifier-state-consolidation-2026-07-04.md
      sha: "888906f2"
      rule: R1

  - repo: forge                # GN-4 — U2: task-id flagged-blank, never synthesised
    task: null                 # U2 — <wiring-fix task id from forge tracker>: FLAGGED-BLANK per ratification
    task_id_flag: "U2 — awaiting Rich: forge-tracker wiring-fix task id; do NOT synthesise"
    verdict: reject
    ground_truth_source: merge_review_caught
    feature: FEAT-DD4F
    run: "n/a (fix commit)"
    sha: "1ad98c0"            # fix commit sha
    dc_class: DC-03
    finding:
      class: DC-03
      locus: "serve-boot shim -> three composition-fn calls with nonexistent kwargs, TypeError swallowed by DDR-007 soft-fail; MP-011 pin tests are permissive *args/**kwargs fakes codifying the wrong contract"
    reconstruction_fidelity: reconstructed
    bundle_path: null
    provenance:
      record_path: forge/docs/reviews/feat-spl-002-post-merge-review-2026-07-06.md
      sha: "1ad98c0"
