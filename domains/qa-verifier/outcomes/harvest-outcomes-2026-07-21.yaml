# QAV HARVEST OUTCOMES — the committed curator-outcomes DATA file
# =================================================================
# Ratification: THE LABELING POLICY (census §2), Rich 2026-07-21 — LAW.
#   Labels come ONLY from committed records per rules A1 (approve) / R1 (reject).
#   A2 approved-plus-manual-fix  -> EXCLUDED (not coach_correct).
#   A3 PO-002 reviewer-in-loop   -> QUEUED (autobuild:false; different approve semantics).
#   U2 DD4F wiring-fix task-id   -> stays flagged-blank (never synthesised).
#   merge/FF sha                 -> RATIFIED as the approve provenance sha (no per-task
#                                   approved-sha source of record exists; the approve held as
#                                   of merge).
#   Undecidable                  -> EXCLUDED or QUEUED, NEVER guessed.
#
# This file is the `outcomes` input to src/qav/harvest.py::harvest(), keyed by (repo, task).
# Only the `approve` and `reject` sections below are CONSUMABLE labels. The `queued` section
# is NOT consumable — those rows carry no evidence-derived label and await Rich's curation.
#
# Banking != training: these rows are DF-008-private DATA. No tune trains in this lane.
#
# Provenance model per label:
#   ground_truth_source / feature / run / sha / finding  -> the Outcome dataclass fields
#     (src/qav/harvest.py::Outcome; harvest() builds provenance quintet {repo,feature,task,run,sha}).
#   provenance.record_path  -> the on-disk committed record the label is READ FROM.
#   provenance.rule         -> the policy rule (A1 / R1) that authorised the label.
#   bundle_path             -> the discovered final-turn coach_evidence bundle the label attaches
#                              to (present = harvestable today; null = reconstructed, no verbatim bundle).
#
# Union basis: GB10 census 82 finals (run_logs/qav-harvest-census-2026-07-21.jsonl) UNIONED with
# the Mac sweep (incoming/, 147 coach_evidence files). Union result: 0 new tasks, 0 new bundles,
# 0 divergences — every Mac final-turn bundle is a byte-duplicate of a GB10 final. See
# receipts/harvest-union-census-2026-07-21.md.

# =====================================================================================
# APPROVE labels (verdict=approve, ground_truth_source=coach_correct, generation_mode=harvest)
# Rule A1 — Autobuild-approved-and-held: (repo,task) carries tasks[].decision=="approved" in a
# committed merge_summary.json AND no manual-fix commit AND the final-turn bundle is discovered.
# =====================================================================================
approve:
  - repo: guardkit
    task: TASK-BDDW-001
    verdict: approve
    ground_truth_source: coach_correct
    feature: FEAT-E2CB
    run: "autobuild/FEAT-E2CB"
    sha: "917bcef7"          # FF merge sha (RATIFIED approve provenance sha)
    split: train
    ugly_green: true          # advisory blemishes present (census jsonl)
    bundle_path: guardkit/.guardkit/worktrees/FEAT-E2CB/.guardkit/autobuild/TASK-BDDW-001/coach_evidence_turn_1.json
    provenance:
      record_path: guardkit/.guardkit/archive/FEAT-E2CB/merge_summary.json
      sha: "917bcef7"
      rule: A1

  - repo: guardkit
    task: TASK-BDDW-002
    verdict: approve
    ground_truth_source: coach_correct
    feature: FEAT-E2CB
    run: "autobuild/FEAT-E2CB"
    sha: "917bcef7"
    split: train
    ugly_green: true
    bundle_path: guardkit/.guardkit/worktrees/FEAT-E2CB/.guardkit/autobuild/TASK-BDDW-002/coach_evidence_turn_1.json
    provenance:
      record_path: guardkit/.guardkit/archive/FEAT-E2CB/merge_summary.json
      sha: "917bcef7"
      rule: A1

# =====================================================================================
# REJECT labels (verdict=reject, generation_mode=gold_negative, split=eval_qav by contract)
# Rule R1 — Documented gold negative: named in SPEC-qav-gold-negatives.md with a full
# provenance dict + a committed retro on disk + a stated DC class + a *_caught source.
# These are the FEAT-EVAL-QAV must-catch holdout — NEVER in any training manifest.
# =====================================================================================
reject:
