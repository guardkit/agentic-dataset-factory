    feature: FEAT-PH1-002
    record_path: study-tutor/.guardkit/archive/FEAT-PH1-002/merge_summary.json   # (incoming/ only — Mac-new)
    tasks: [TASK-DSP-001, TASK-DSP-002, TASK-DSP-003, TASK-DSP-004, TASK-DSP-005, TASK-DSP-006, TASK-DSP-007]

  - reason: "Mac-new record; squash feature-merge (tasks_merged list, no decision field); autobuild artifacts intentionally not committed -> zero bundles"
    repo: study-tutor
    feature: FEAT-PH1-003
    record_path: study-tutor/.guardkit/archive/FEAT-PH1-003/merge_summary.json   # (incoming/ only — Mac-new)
    tasks: [TASK-DTL-001, TASK-DTL-002, TASK-DTL-003, TASK-DTL-004, TASK-DTL-005]

  # --- A2: approved-plus-manual-fix -> EXCLUDED (not coach_correct); also not in discovered set ---
