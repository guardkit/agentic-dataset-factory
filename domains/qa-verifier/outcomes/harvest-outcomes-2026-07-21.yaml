# =====================================================================================
# QUEUED — NOT consumable labels. Held for Rich's curation; never guessed.
# =====================================================================================
queued:
  # --- A1-blocked: merge_summary approves whose bundles DO NOT EXIST on disk ---
  # PRV presence-confirm (the one the census owed) = NEGATIVE. FEAT-70A4 merge_summary lists
  # TASK-PRV-001..007 all decision=approved, but ZERO coach_evidence bundles exist for any
  # TASK-PRV task on GB10 corpus OR the Mac sweep. A1's join (bundle must be discovered) FAILS.
  # The census's "7 probable approves" are therefore DISCONFIRMED -> queued, not labelable.
  - reason: "A1-blocked — merge_summary approved but no discovered bundle (PRV presence-confirm NEGATIVE)"
    repo: study-tutor
    feature: FEAT-70A4
    record_path: study-tutor/.guardkit/archive/FEAT-70A4/merge_summary.json
    tasks: [TASK-PRV-001, TASK-PRV-002, TASK-PRV-003, TASK-PRV-004, TASK-PRV-005, TASK-PRV-006, TASK-PRV-007]

  # --- A3: reviewer-in-loop "completed" (autobuild:false) — different approve semantics ---
  - reason: "A3 — reviewer-in-loop completed, not an autobuild coach 'approved' decision; no bundles exist"
    repo: study-tutor
    feature: FEAT-PO-002
    record_path: study-tutor/.guardkit/archive/FEAT-PO-002/merge_summary.json
    tasks: [TASK-PO02-001, TASK-PO02-002, TASK-PO02-003, TASK-PO02-004, TASK-PO02-005, TASK-PO02-006, TASK-PO02-007]

  # --- Mac-NEW outcome records (GB10 lacked these merge summaries). Mined per task instr.
  #     None yields a labelable approve: no tasks[].decision=="approved" field AND
  #     per-task autobuild artifacts explicitly not committed -> zero bundles to join. ---
  - reason: "Mac-new record; manual /task-work (not /feature-build), no autobuild, no bundles, no per-task decision field"
    repo: guardkit
    feature: FEAT-ATR
    record_path: guardkit/.guardkit/archive/FEAT-ATR/merge_summary.json   # (incoming/ only — Mac-new)
